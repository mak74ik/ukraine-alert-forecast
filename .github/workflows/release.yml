name: Build & Publish Release Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }} - ${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
            artifact_name: ukraine-alert-forecast-windows-x64.exe
            zip_name: ukraine-alert-forecast-windows-x64.zip
          - os: macos-latest
            arch: arm64
            artifact_name: UA Alert Forecast.app
            zip_name: ukraine-alert-forecast-macos-arm64.zip
          - os: macos-13
            arch: x64
            artifact_name: UA Alert Forecast.app
            zip_name: ukraine-alert-forecast-macos-x64.zip
          - os: ubuntu-latest
            arch: x64
            artifact_name: ukraine-alert-forecast
            zip_name: ukraine-alert-forecast-linux-x64.tar.gz

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-0 libgtk-3-0 || true

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pillow

      - name: Build Executable with PyInstaller
        run: |
          pyinstaller ukraine-alert-forecast.spec --clean -y

      - name: Package Windows Binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item "dist/ukraine-alert-forecast.exe" -Destination "dist/${{ matrix.artifact_name }}"
          Compress-Archive -Path "dist/${{ matrix.artifact_name }}" -DestinationPath "dist/${{ matrix.zip_name }}"

      - name: Package macOS Binary
        if: runner.os == 'macOS'
        run: |
          codesign --force --deep --sign - "dist/UA Alert Forecast.app"
          mkdir -p dist/dmg_root
          cp -R "dist/UA Alert Forecast.app" dist/dmg_root/
          ln -s /Applications dist/dmg_root/Applications
          hdiutil create -volname "UA Alert Forecast" -srcfolder dist/dmg_root -ov -format UDZO "dist/UA-Alert-Forecast-macOS-${{ matrix.arch }}.dmg"
          cd dist
          zip -r -9 "${{ matrix.zip_name }}" "UA Alert Forecast.app"
          cp "${{ matrix.zip_name }}" "UA-Alert-Forecast-macOS.zip" || true
          cp "UA-Alert-Forecast-macOS-${{ matrix.arch }}.dmg" "UA-Alert-Forecast-macOS.dmg" || true

      - name: Package Linux Binary
        if: runner.os == 'Linux'
        run: |
          chmod +x dist/ukraine-alert-forecast
          mv dist/ukraine-alert-forecast dist/ukraine-alert-forecast-linux-x64
          cd dist
          tar czvf "${{ matrix.zip_name }}" ukraine-alert-forecast-linux-x64

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.exe
            dist/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
